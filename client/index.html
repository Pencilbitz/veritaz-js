<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111844" />
    <!-- Title, description, canonical address, link-preview tags and
         structured data go here, from src/seo/site.js (vite-plugin-seo.js). -->
    <!--seo-->
    <!-- The fonts are served from this site (src/fonts.css). Body text and
         headings appear on every first screen, so their files start loading
         at once instead of after the stylesheet. -->
    <link rel="preload" href="/src/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/source-serif-4-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Books, events and pictures come from Supabase: open both connections
         early (data requests use the crossorigin one, pictures the other). -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <!--route-preloads-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
